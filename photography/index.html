<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="icon" href="/public/assets/favicon.png?v=2" type="image/png">
    <title>Photography — Viraj Kabbur</title>
    <script src="../page-transition-pending.js"></script>
    <script src="../theme.js"></script>
    <script src="../chrome-glass.js"></script>
    <link rel="stylesheet" href="../styles.css">
    <link rel="stylesheet" href="photography.css">
</head>
<body class="photography-page section-page" data-page-transition="enter exit">
    <aside class="page-toolbar" aria-label="Page actions">
        <button
            type="button"
            class="page-toolbar__btn page-toolbar__btn--theme"
            data-asset-base="../public/assets"
            aria-label="Switch to dark mode"
        >
            <img
                src="../public/assets/dark-mode.svg"
                alt=""
                class="page-toolbar__icon page-toolbar__icon--theme"
                width="32"
                height="32"
            >
        </button>
        <a href="../" class="page-toolbar__btn page-toolbar__btn--home page-link" aria-label="Go home">
            <img
                src="../public/assets/go-home.svg"
                alt=""
                class="page-toolbar__icon"
                width="32"
                height="32"
            >
        </a>
    </aside>

    <div class="page">
        <header class="nav">
            <div class="nav__inner">
                <a href="../about-me/" class="nav__avatar-link page-link" aria-label="About me">
                    <img
                        class="nav__avatar"
                        src="../public/assets/profile-picture.png"
                        alt="Viraj Kabbur"
                    >
                </a>
                <nav>
                    <ul class="nav__links">
                        <li><a class="nav__link" href="https://www.linkedin.com/in/virajkabbur/" target="_blank" rel="noopener noreferrer">Linkedin</a></li>
                        <li><a class="nav__link" href="mailto:virajkabbur@yahoo.com">Let's Talk</a></li>
                    </ul>
                </nav>
            </div>
        </header>

        <main class="section">
            <h1 class="section__title section__title--photography">Photography</h1>
            <p class="section__intro">
                <span>A gallery of moments captured through my lens.</span>
                <span class="section__count">16 frames</span>
            </p>

            <div class="section__content">
                <h2 class="section-divider section-divider--photography">Gallery</h2>
                <div class="gallery" id="gallery" aria-label="Photography gallery">
                    <button class="gallery__item" type="button" aria-label="View photograph 1">
                        <img src="../public/assets/photography/IMG_3375.JPG" alt="Photograph by Viraj Kabbur" loading="lazy" decoding="async">
                    </button>
                    <button class="gallery__item" type="button" aria-label="View photograph 2">
                        <img src="../public/assets/photography/IMG_0878.JPG" alt="Photograph by Viraj Kabbur" loading="lazy" decoding="async">
                    </button>
                    <button class="gallery__item" type="button" aria-label="View photograph 3">
                        <img src="../public/assets/photography/IMG_1225.JPG" alt="Photograph by Viraj Kabbur" loading="lazy" decoding="async">
                    </button>
                    <button class="gallery__item" type="button" aria-label="View photograph 4">
                        <img src="../public/assets/photography/NO_FUSION_0619_010.jpg?v=2" alt="Photograph by Viraj Kabbur" loading="lazy" decoding="async">
                    </button>
                    <button class="gallery__item" type="button" aria-label="View photograph 5">

                    </button>
                    <button class="gallery__item" type="button" aria-label="View photograph 6">
                        <img src="../public/assets/photography/IMG_1450.JPG" alt="Photograph by Viraj Kabbur" loading="lazy" decoding="async">
                    </button>
                    <button class="gallery__item" type="button" aria-label="View photograph 7">
                        <img src="../public/assets/photography/IMG_1026.JPG" alt="Photograph by Viraj Kabbur" loading="lazy" decoding="async">
                    </button>
                    <button class="gallery__item" type="button" aria-label="View photograph 8">
                        <img src="../public/assets/photography/NO_FUSION_0429_029.jpg?v=2" alt="Photograph by Viraj Kabbur" loading="lazy" decoding="async">
                    </button>
                    <button class="gallery__item" type="button" aria-label="View photograph 9">
                        <img src="../public/assets/photography/IMG_1416.JPG" alt="Photograph by Viraj Kabbur" loading="lazy" decoding="async">
                    </button>
                    <button class="gallery__item" type="button" aria-label="View photograph 10">
                        <img src="../public/assets/photography/IMG_0941.JPG" alt="Photograph by Viraj Kabbur" loading="lazy" decoding="async">
                    </button>
                    <button class="gallery__item" type="button" aria-label="View photograph 11">
                        <img src="../public/assets/photography/IMG_0211.jpg" alt="Photograph by Viraj Kabbur" loading="lazy" decoding="async">
                    </button>
                    <button class="gallery__item" type="button" aria-label="View photograph 12">
                        <img src="../public/assets/photography/NO_FUSION_0515_007.jpg?v=2" alt="Photograph by Viraj Kabbur" loading="lazy" decoding="async">
                    </button>
                    <button class="gallery__item" type="button" aria-label="View photograph 13">
                        <img src="../public/assets/photography/IMG_4394_Original.jpg" alt="Photograph by Viraj Kabbur" loading="lazy" decoding="async">
                    </button>
                    <button class="gallery__item" type="button" aria-label="View photograph 14">
                        <img src="../public/assets/photography/NO_FUSION_0517_007.jpg?v=2" alt="Photograph by Viraj Kabbur" loading="lazy" decoding="async">
                    </button>
                    <button class="gallery__item" type="button" aria-label="View photograph 15">
                        <img src="../public/assets/photography/NO_FUSION_0503_003.jpg?v=2" alt="Photograph by Viraj Kabbur" loading="lazy" decoding="async">
                    </button>
                    <button class="gallery__item" type="button" aria-label="View photograph 16">
                        <img src="../public/assets/photography/NO_FUSION_0522_001.jpg?v=2" alt="Photograph by Viraj Kabbur" loading="lazy" decoding="async">
                    </button>
                </div>
            </div>
        </main>

        <footer class="footer">2026 @ Viraj Kabbur</footer>
    </div>

    <div class="lightbox" id="lightbox" aria-hidden="true" role="dialog" aria-label="Image viewer">
        <button class="lightbox__btn lightbox__close" type="button" aria-label="Close viewer">×</button>
        <button class="lightbox__btn lightbox__prev" type="button" aria-label="Previous image">‹</button>
        <button class="lightbox__btn lightbox__next" type="button" aria-label="Next image">›</button>
        <div class="lightbox__stage">
            <img class="lightbox__img" src="" alt="">
        </div>
        <span class="lightbox__count" aria-live="polite"></span>
    </div>

    <script src="../public/vendor/gsap.min.js"></script>
    <script src="../page-transition.js"></script>
    <script src="photography.js"></script>
</body>
</html>
